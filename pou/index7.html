    <!-- SIMULADOR AVANZADO ANTIBLOQUEO DE YT PLAYABLES -->
    <script nonce="nEsvHewDKSKQZPWExNde-A">
        // Fallback que siempre devuelve una promesa resuelta (seguro para cadenas .then/.catch)
const createFallbackFunction = (path) => {
    // Creamos una función que, al invocarse, devuelve otro proxy (cadena infinita)
    const fn = function(...args) {
        console.log(`YTGame Proxy Fallback: ${path.join('.')}() llamado con:`, args);

        // Overrides específicos que deben devolver valores reales (no proxies)
        if (path.includes('getLanguage')) {
            return Promise.resolve(navigator.language || "en-US");
        }
        if (path.includes('isAudioEnabled')) {
            return true;
        }
        if (path.includes('loadData')) {
            const jsonString = '{}';
            const thenableString = new String(jsonString);
            thenableString.then = function(resolve) { return Promise.resolve(jsonString).then(resolve); };
            thenableString.catch = function() { return this; };
            return thenableString;
        }
        if (path.includes('firstFrameReady')) {
            return Promise.resolve();
        }

        // Por defecto devolvemos OTRO proxy dinámico (permite cadenas infinitas)
        return createDynamicProxy([...path, '()']);
    };

    // Le añadimos .then y .catch para que `await proxy` funcione
    fn.then = function(resolve) {
        return Promise.resolve(null).then(resolve);
    };
    fn.catch = function() {
        return this;
    };

    return fn;
};
        // Creamos un Proxy inteligente que genera sub-propiedades dinámicamente
        const createDynamicProxy = (currentPath = []) => {
            return new Proxy(createFallbackFunction(currentPath), {
                get: (target, prop) => {
                    if (prop === 'then' || prop === 'catch') return undefined;
                    return createDynamicProxy([...currentPath, prop]);
                }
            });
        };

        // Inyectamos el objeto ytgame global antes de que carguen las librerías
        window.ytgame = createDynamicProxy(['ytgame']);
    </script>
    
    <!-- #FASTLIB# -->
    <script defer src="fastLib/_importer.js" data-fast="fastLib/fastHeader.js" data-fast-options="{'checkbrowser':false}" type="text/javascript" nonce="nEsvHewDKSKQZPWExNde-A"></script>

    <script type="text/javascript" nonce="nEsvHewDKSKQZPWExNde-A">
        document.addEventListener('fastloaded', function(e)
        {
            window.fast.gameReady = function()
            {
                window.fast.goGame({
                    prepare:prepareGame,
                    body:["vendor/phaser.min.js", "vendor/box2d-p3.min.js", "pou.min.js"],
                    init:function(){ window.gameStart(), window.fastActivePopup(), ytgame.game.firstFrameReady() },

                    exitfs:function(){ },
                    afterinfs:function(){ window.fastCheckMiniGameForMiui(true) }
                });
                console.log("inside [gameReady] -> "+window.fast.lang);
            }
            window.fast.stageElements(window.fast.gameReady, {fsbehind:true, nostats:true});
        }, false);
    </script>
    <!-- end-fast-library -->
    
    <script nonce="nEsvHewDKSKQZPWExNde-A">
        async function prepareGame()
        {
            //check audio
            window.fast.gameAudio = ytgame.system.isAudioEnabled();
            //check lang
            await ytgame.system.getLanguage().then(function(lang)
            {
                //strip the subtag and default to english if not supported
                if (typeof lang === 'string') {
                    lang = lang.split('-')[0];
                }
                lang = (window.fast.info.languages.indexOf(lang)>-1) ? lang : window.fast.info.languages[0];
                console.log('set lang to '+lang);
                window.fast.lang = lang;
                return new Promise((resolve, reject) => { resolve() });
            });
        }
        //onchangeaudio
        ytgame.system.onAudioEnabledChange(function(isAudioEnabled)
        {
            if(window.fast) window.fast.gameAudio = isAudioEnabled;
            if(typeof window.fastEnableAudio==="function") window.fastEnableAudio(isAudioEnabled);
        });
    </script>
