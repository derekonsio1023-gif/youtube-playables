<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cargando…</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
</head>
<body>
<script>
(async function () {
  const GAME_URL = 'https://raw.githack.com/derekonsio1023-gif/youtube-playables/refs/heads/main/flappy%20dunk/index.html';
  const BASE_DIR = GAME_URL.replace(/[^/]*$/, '');

  // ── Shim universal con Proxy ─────────────────────────────────
  // Cualquier método exista o no en el SDK real, devuelve una
  // Promise resuelta. Así nunca más "ytgame is not defined" ni
  // "ytgame.algo is not a function".
  const SHIM_JS = `
(function(){
  const P = v => () => Promise.resolve(v);
  const N = () => {};                              // no-op sync
  const SAVE = P({ data: '', checksum: '' });      // forma que espera Unity

  const api = {
    game: {
      firstFrameReady:   N,
      gameReady:         N,
      loadData:          SAVE,
      saveData:          P(undefined),
      sendScore:         P(undefined),
      log:               N,
      getLanguage:       P('en'),
      getSafeArea:       P({ top:0, left:0, right:0, bottom:0 })
    },

    system: {
      onPause:              N,     // <-- ESTO faltaba
      onResume:             N,
      onStateChange:        N,
      isAudioEnabled:       P(true),
      onAudioEnabledChange: N
    },

    engagement: {
      sendScore:  P(undefined),
      openStore:  P(undefined)
    },

    environment: {
      getEnvironment: P({})
    },

    health: {
      logError:   N,
      logWarning: N,
      logInfo:    N
    },

    ads: {
      requestInterstitialAd: P(undefined),
      requestRewardedAd:     P({ status: 'closed' })
    }
  };

  // Proxy que envuelve TODO recursivamente (no solo la raíz)
  function wrap(obj, path){
    return new Proxy(obj, {
      get(t, p){
        if (p === 'then') return undefined;               // nunca ser thenable
        if (typeof p === 'symbol') return undefined;
        const v = t[p];
        if (v !== undefined) {
          if (typeof v === 'function') return v;          // método: devuélvelo tal cual
          if (typeof v === 'object' && v !== null) return wrap(v, path + '.' + String(p));  // recursión
          return v;
        }
        // Auto-stub: cualquier método que falte devuelve Promise válida
        const stub = function(){ return Promise.resolve({ data: '', checksum: '' }); };
        return wrap(stub, path + '.' + String(p));
      },
      apply(){ return Promise.resolve({ data: '', checksum: '' }); }
    });
  }

  const _shim = wrap(api, 'ytgame');
  Object.defineProperty(window, 'ytgame', {
    get(){ return _shim; },
    set(_v){ /* ignorar */ },
    configurable: false,
    enumerable: true
  });
})();
`;

  // OJO: construimos las etiquetas con concatenación para que el
  // <script> EXTERNO no se cierre antes de tiempo.
  const TAG_OPEN  = '<' + 'script>';
  const TAG_CLOSE = '</' + 'script>';
  const SHIM = TAG_OPEN + SHIM_JS + TAG_CLOSE;

  try {
  const res  = await fetch(GAME_URL);
  let   html = await res.text();

  // 1) <base> para rutas relativas
  html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + BASE_DIR + '">');

  // 2) Eliminar cualquier <script src="...ytgame.js..."></script>
  html = html.replace(
    /<script\b[^>]*\bsrc\s*=\s*["'][^"']*ytgame\.js[^"']*["'][^>]*>\s*<\/script>/gi,
    ''
  );

  // 3) Inyectar nuestro shim ANTES del primer <script> restante
  html = html.replace(/<script/i, SHIM + '<script');

  // 4) Reescribir el documento
  document.open();
  document.write(html);
  document.close();
} catch (e) {
    document.body.innerHTML =
      '<pre style="color:#ff5555;padding:20px;font-family:monospace">' +
      'Error cargando el juego:\n' + (e && e.message ? e.message : e) + '</pre>';
  }
})();
</script>
</body>
</html>
