<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cargando…</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:monospace}</style>
</head>
<body>
<script>
(async function () {
  // ── URL del juego (acepta ?g=… para reutilizar el mismo shim) ──
  const GAME_URL = new URLSearchParams(location.search).get('g')
    || 'https://raw.githack.com/derekonsio1023-gif/youtube-playables/refs/heads/main/flappy%20dunk/index.html';
  const BASE_DIR = GAME_URL.replace(/[^/]*$/, '');

  // ── Shim universal (array join para evitar problemas de escape) ──
  const SHIM_JS = [
    '(function(){',
    '  // ── 1) Bloqueo de ytgame.js real ──',
    '  (function(){',
    '    var _create = document.createElement.bind(document);',
    '    document.createElement = function(tag){',
    '      var el = _create(tag);',
    '      if (String(tag).toLowerCase() === "script") {',
    '        var _src = "";',
    '        Object.defineProperty(el, "src", {',
    '          get: function(){ return _src; },',
    '          set: function(v){',
    '            if (typeof v === "string" && /ytgame\\.js/i.test(v)) return;',
    '            _src = v;',
    '            el.setAttribute("src", v);',
    '          },',
    '          configurable: true',
    '        });',
    '      }',
    '      return el;',
    '    };',
    '    var _append = Element.prototype.appendChild;',
    '    Element.prototype.appendChild = function(child){',
    '      if (child && child.tagName === "SCRIPT" && child.src && /ytgame\\.js/i.test(child.src)) {',
    '        return child;',
    '      }',
    '      return _append.call(this, child);',
    '    };',
    '  })();',
    '',
    '  // ── 2) Shim del SDK ──',
    '  var P = function(v){ return function(){ return Promise.resolve(v); }; };',
    '  var N = function(){};',
    '  var SAVE = P({ data: "", checksum: "" });',
    '',
    '  var api = {',
    '    game: {',
    '      firstFrameReady: N, gameReady: N,',
    '      loadData: SAVE, saveData: P(undefined), sendScore: P(undefined),',
    '      log: N, getLanguage: P("en"),',
    '      getSafeArea: P({ top:0, left:0, right:0, bottom:0 })',
    '    },',
    '    system: {',
    '      onPause: N, onResume: N, onStateChange: N,',
    '      isAudioEnabled: P(true), onAudioEnabledChange: N',
    '    },',
    '    engagement: { sendScore: P(undefined), openStore: P(undefined) },',
    '    environment: { getEnvironment: P({}) },',
    '    health: { logError: N, logWarning: N, logInfo: N },',
    '    ads: {',
    '      requestInterstitialAd: P(undefined),',
    '      requestRewardedAd: P({ status: "closed" })',
    '    }',
    '  };',
    '',
    '  // ── 3) Proxy recursivo (auto-stub de cualquier método) ──',
    '  function wrap(obj, path){',
    '    return new Proxy(obj, {',
    '      get: function(t, p){',
    '        if (p === "then") return undefined;',
    '        if (typeof p === "symbol") return undefined;',
    '        var v = t[p];',
    '        if (v !== undefined) {',
    '          if (typeof v === "function") return v;',
    '          if (typeof v === "object" && v !== null) return wrap(v, path + "." + String(p));',
    '          return v;',
    '        }',
    '        var stub = function(){ return Promise.resolve({ data: "", checksum: "" }); };',
    '        return wrap(stub, path + "." + String(p));',
    '      },',
    '      apply: function(){ return Promise.resolve({ data: "", checksum: "" }); }',
    '    });',
    '  }',
    '',
    '  // ── 4) Blindaje del global ──',
    '  var _shim = wrap(api, "ytgame");',
    '  Object.defineProperty(window, "ytgame", {',
    '    get: function(){ return _shim; },',
    '    set: function(_v){},',
    '    configurable: false,',
    '    enumerable: true',
    '  });',
    '})();'
  ].join('\n');

  const TAG_OPEN  = '<' + 'script>';
  const TAG_CLOSE = '<' + '/script>';
  const SHIM = TAG_OPEN + SHIM_JS + TAG_CLOSE;

  try {
    const res  = await fetch(GAME_URL);
    let   html = await res.text();

    // 1) <base> para rutas relativas
    html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + BASE_DIR + '">');

    // 2) Eliminar <script src="...ytgame.js..."></script>
    const CLOSE_TAG = "<" + "/script>";
    const YTG_RE = new RegExp(
      "<script\\b[^>]*\\bsrc\\s*=\\s*[\"'][^\"']*ytgame\\.js[^\"']*[\"'][^>]*>\\s*" + CLOSE_TAG,
      "gi"
    );
    html = html.replace(YTG_RE, "");

    // 3) Inyectar el shim antes del primer <script> restante
    html = html.replace(/<script/i, SHIM + '<script');

    // 4) Reescribir el documento
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML =
      '<pre style="color:#ff5555;padding:20px;font-family:monospace">' +
      'Error cargando el juego:\n' + (e && e.message ? e.message : e) + '</pre>';
  }
})();
</script>
</body>
</html>
