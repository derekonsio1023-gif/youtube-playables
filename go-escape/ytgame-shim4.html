<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cargando…</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:monospace</style>
</head>
<body>
<script>
// ══════════════════════════════════════════════════════════════════
//  SHIM como función real (cero problemas de escape)
// ══════════════════════════════════════════════════════════════════
function ULTRON_SHIM() {
  // ── 0a) CORS: interceptar TODOS los caminos posibles ──
  (function () {
    function forceCORS(el) {
      if (!el || el.__ultronCors) return;
      el.__ultronCors = true;
      try { if (!el.crossOrigin) el.crossOrigin = 'anonymous'; } catch (e) {}
    }

    // 1) src setter (path principal de PIXI)
    try {
      var srcDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
      if (srcDesc) {
        Object.defineProperty(HTMLImageElement.prototype, 'src', {
          get: function () { return srcDesc.get.call(this); },
          set: function (v) { forceCORS(this); srcDesc.set.call(this, v); },
          configurable: true
        });
      }
    } catch (e) {}

    // 2) crossOrigin setter (PIXI hace img.crossOrigin = null)
    try {
      var coDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'crossOrigin');
      if (coDesc) {
        Object.defineProperty(HTMLImageElement.prototype, 'crossOrigin', {
          get: function () { return coDesc.get.call(this); },
          set: function (v) { coDesc.set.call(this, v || 'anonymous'); },
          configurable: true
        });
      }
    } catch (e) {}

    // 3) setAttribute('src', ...)
    var _sa = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function (n, v) {
      if (this.tagName === 'IMG' && String(n).toLowerCase() === 'src') forceCORS(this);
      return _sa.call(this, n, v);
    };

    // 4) createElement('img')
    var _create = document.createElement.bind(document);
    document.createElement = function (tag) {
      var el = _create(tag);
      if (String(tag).toLowerCase() === 'img') forceCORS(el);
      return el;
    };

    // 5) new Image()
    try {
      var _Image = window.Image;
      window.Image = function (w, h) {
        var img = new _Image(w, h);
        forceCORS(img);
        return img;
      };
      window.Image.prototype = _Image.prototype;
    } catch (e) {}
  })();

  // ── 0b) Bloquear SDK real de ytgame ──
  (function () {
    var _create = document.createElement.bind(document);
    document.createElement = function (tag) {
      var el = _create(tag);
      if (String(tag).toLowerCase() === 'script') {
        var _src = '';
        Object.defineProperty(el, 'src', {
          get: function () { return _src; },
          set: function (v) {
            if (typeof v === 'string' && /ytgame\.js/i.test(v)) return;
            _src = v;
            el.setAttribute('src', v);
          },
          configurable: true
        });
      }
      return el;
    };
    var _append = Element.prototype.appendChild;
    Element.prototype.appendChild = function (c) {
      if (c && c.tagName === 'SCRIPT' && c.src && /ytgame\.js/i.test(c.src)) return c;
      return _append.call(this, c);
    };
  })();

  // ── 1) API del shim ──
  var P = function (v) { return function () { return Promise.resolve(v); }; };
  var N = function () {};
  var SAVE = P({ data: '', checksum: '' });

  var api = {
    game: {
      firstFrameReady: N, gameReady: N,
      loadData: SAVE, saveData: P(), sendScore: P(), log: N,
      getLanguage: P('en'),
      getSafeArea: P({ top: 0, left: 0, right: 0, bottom: 0 })
    },
    system: {
      onPause: N, onResume: N, onStateChange: N,
      isAudioEnabled: P(true), onAudioEnabledChange: N
    },
    engagement: { sendScore: P(), openStore: P() },
    environment: { getEnvironment: P({}) },
    health: { logError: N, logWarning: N, logInfo: N },
    ads: {
      requestInterstitialAd: P(),
      requestRewardedAd: P({ status: 'closed' })
    }
  };

  // ── 2) Proxy recursivo ──
  function wrap(o, p) {
    return new Proxy(o, {
      get: function (t, k) {
        if (k === 'then') return undefined;
        if (typeof k === 'symbol') return undefined;
        var v = t[k];
        if (v !== undefined) {
          if (typeof v === 'function') return v;
          if (typeof v === 'object' && v !== null) return wrap(v, p + '.' + String(k));
          return v;
        }
        var stub = function () { return Promise.resolve({ data: '', checksum: '' }); };
        return wrap(stub, p + '.' + String(k));
      },
      apply: function () { return Promise.resolve({ data: '', checksum: '' }); }
    });
  }

  // ── 3) Blindar el global ──
  var s = wrap(api, 'ytgame');
  Object.defineProperty(window, 'ytgame', {
    get: function () { return s; },
    set: function () {},
    configurable: false,
    enumerable: true
  });
}

// ══════════════════════════════════════════════════════════════════
//  Cargador
// ══════════════════════════════════════════════════════════════════
(function () {
  var LT = String.fromCharCode(60);
  var GT = String.fromCharCode(62);
  var SL = String.fromCharCode(47);
  var SC = LT + 'script' + GT;
  var EC = LT + SL + 'script' + GT;

  var qs = new URLSearchParams(location.search);
  var GAME_URL = qs.get('g')
    || 'https://raw.githack.com/derekonsio1023-gif/youtube-playables/refs/heads/main/go-escape/index.html';
  var BASE_DIR = GAME_URL.replace(/[^/]*$/, '');

  var SHIM = SC + '(' + ULTRON_SHIM.toString() + ')();' + EC;

  fetch(GAME_URL)
    .then(function (r) { return r.text(); })
    .then(function (html) {
      html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + BASE_DIR + '">');

      // Quitar scripts que carguen el SDK real
      var needle = 'ytgame.js';
      var i = html.indexOf(needle);
      while (i !== -1) {
        var openTag = html.lastIndexOf(LT, i);
        var closeTag = html.indexOf(EC, i);
        if (openTag !== -1 && closeTag !== -1) {
          html = html.slice(0, openTag) + html.slice(closeTag + EC.length);
        }
        i = html.indexOf(needle, i + needle.length);
      }

      // Inyectar shim antes del primer script
      var firstScript = html.indexOf(SC);
      if (firstScript !== -1) {
        html = html.slice(0, firstScript) + SHIM + html.slice(firstScript);
      } else {
        html = html.replace(new RegExp('(' + LT + '\\/head' + GT + ')', 'i'), SHIM + '$1');
      }

      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (e) {
      document.body.innerHTML = 'Error cargando el juego: ' + (e && e.message ? e.message : e);
    });
})();
</script>
</body>
</html>
